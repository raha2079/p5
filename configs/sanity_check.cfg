# Sanity Check Configuration
# Short run to verify acceptance rate, steering, quadtree splitting

# Protein setup
pdb_path = data/1UAO.pdb
chain_id = A
model_number = 1

# Planner configuration
planner_name = QuadtreePlanner
max_iterations = 1000
wall_clock_budget_seconds = 60.0

# Energy model parameters (from native clash check)
exclude_1_4_neighbors = false
radii_scale_factor = 1.0
tau = 1.0

# Quadtree parameters (Section 8)
use_energy_weighting = true
uniform_sampling_prob = 0.20
trials_per_attempt = 8
steering_std_dev = 0.1745

# Output
output_file = results/sanity_check_planner_data.bin
metadata_file = results/sanity_check_metadata.txt

# Random seed
random_seed = 42
