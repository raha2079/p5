# Protein Folding Planner Configuration
# ======================================
#
# This is an example configuration file for Milestone 1.
# It demonstrates the basic configuration format.
#
# Format: key = value
# Lines starting with # are comments
# Empty lines are ignored

# Planner selection
# -----------------
# Available planners: RRT, RRTConnect, PRM
# See PlannerRegistry::getRegisteredNames() for full list
planner = RRT

# Protein structure
# -----------------
# Number of amino acid residues to model
# For Milestone 1 testing, we use 2 residues
num_residues = 2

# Motion validator parameters
# ---------------------------
# Number of intermediate states to check along each motion
interpolation_resolution = 10

# Temperature in Kelvin for probabilistic acceptance
# Higher temperature = more uphill moves accepted
temperature = 300.0

# Energy model (optional for Milestone 1)
# ----------------------------------------
# Available evaluators: TestEnergy, ConstantEnergy, HarmonicEnergy
# Leave empty or comment out to use a simple test energy
energy_model = HarmonicEnergy

# Output settings
# ---------------
output_directory = output
export_states = true
save_graph = true

# State validation rules (optional)
# ----------------------------------
# Not yet implemented for Milestone 1
# Example for future use:
# state_rule = AngleBounds
# state_rule = NoClashes

# Planner-specific options (optional)
# ------------------------------------
# Not yet implemented for Milestone 1
# Example for future use:
# planner_option_range = 0.5
# planner_option_goal_bias = 0.1
